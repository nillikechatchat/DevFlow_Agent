apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: devflow-team
spec:
  description: DevFlow agent development team with multi-role worker collaboration
  workerMembers:
    - name: devflow-leader
      role: team_leader
    - name: triage-worker
      role: worker
    - name: architect-worker
      role: worker
    - name: developer-worker
      role: worker
    - name: reviewer-worker
      role: worker
    - name: qa-worker
      role: worker
    - name: retro-worker
      role: worker
